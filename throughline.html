<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Throughline</title>
<meta name="description" content="Throughline: plan, track and explain product builds across design and engineering, from brief to launch.">
<meta name="theme-color" content="#F6F7F9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='9' fill='%234F46E5'/%3E%3Cpath d='M9.5 16.5l4.2 4.2 8.8-9.4' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F6FA; --surface:#FFFFFF; --surface-2:#F1F3F8; --surface-3:#E6E9F1;
  --ink:#0F172A; --ink-2:#475069; --ink-3:#848DA3;
  --line:#E3E6EE; --line-strong:#CBD1DC;
  --accent:#4F46E5; --accent-hover:#4338CA; --accent-ink:#FFFFFF; --accent-soft:#EEF0FF;
  --design:#7C3AED; --design-soft:#F3EEFF; --design-on-dark:#C4B5FD;
  --eng:#0F8A7E; --eng-soft:#E3F4F1; --eng-on-dark:#5EEAD4;
  --danger:#DC2626; --danger-soft:#FDECEC;
  --warn:#B45309; --warn-soft:#FEF3E2;
  --ok:#15803D; --ok-soft:#E8F6EC;
  --violet:var(--design); --violet-soft:var(--design-soft);
  --teal:var(--eng); --teal-soft:var(--eng-soft);
  --ws:var(--accent); --ws-soft:var(--accent-soft); --ws-on-dark:#A5B4FC;
  --side:#0E1424; --side-2:#171F35; --side-ink:#E6E9F2; --side-ink-2:#98A1B7; --side-line:#262F48;
  --av-l:88%; --av-s:50%;
  --scrim:rgb(15 23 42 / .32);
  --shadow-1:0 1px 2px rgb(15 23 42 / .05);
  --shadow-2:0 10px 30px rgb(15 23 42 / .14);
  --font:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
body[data-ws="design"]{--ws:var(--design);--ws-soft:var(--design-soft);--ws-on-dark:var(--design-on-dark)}
body[data-ws="engineering"]{--ws:var(--eng);--ws-soft:var(--eng-soft);--ws-on-dark:var(--eng-on-dark)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ws);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;padding:18px 12px 14px;background:var(--side);color:var(--side-ink);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px;border:0;background:none;color:#fff;text-align:left}
.brand svg{width:32px;height:32px;flex:none}
.brand-name{display:block;font-weight:700;font-size:17px;letter-spacing:-.015em;line-height:1.15}
.brand-sub{display:block;font-size:11.5px;color:var(--side-ink-2);margin-top:1px}
.ws-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border-radius:11px;background:var(--side-2);border:1px solid var(--side-line)}
.ws-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;border-radius:8px;background:transparent;color:var(--side-ink-2);font-size:11.5px;font-weight:600;white-space:nowrap;min-width:0}
.ws-btn svg{width:18px;height:18px}
.ws-btn:hover{color:#fff;background:rgb(255 255 255 / .05)}
.ws-btn[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.ws-btn.ws-overview[aria-pressed="true"] svg{color:var(--accent)}
.ws-btn.ws-design[aria-pressed="true"] svg{color:var(--design)}
.ws-btn.ws-engineering[aria-pressed="true"] svg{color:var(--eng)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{display:block;padding:4px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6A7390}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--side-ink-2);font-weight:500;font-size:14px;text-align:left;white-space:nowrap}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:rgb(255 255 255 / .06);color:#fff}
.nav-btn[aria-current="page"]{background:rgb(255 255 255 / .1);color:#fff;font-weight:600}
.nav-btn[aria-current="page"] svg{color:var(--ws-on-dark)}
.nav-count{margin-left:auto;min-width:20px;padding:0 6px;border-radius:999px;background:rgb(255 255 255 / .1);color:var(--side-ink);font-size:11.5px;font-weight:600;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.nav-btn[aria-current="page"] .nav-count{background:var(--ws-on-dark);color:var(--side)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:11px;background:var(--side-2);border:1px solid var(--side-line);font-size:12.5px;color:var(--side-ink-2)}
.conn-list{display:flex;flex-direction:column;gap:5px}
.conn{display:flex;align-items:center;gap:8px}
.conn .d{width:7px;height:7px;border-radius:50%;background:#58627A;flex:none}
.conn.on .d{background:#34D399}
.conn.warn .d{background:#FBBF24}
.conn.off .d{background:#3A4459}
.side-foot .btn{width:100%;background:transparent;border-color:var(--side-line);color:var(--side-ink)}
.side-foot .btn:hover{background:rgb(255 255 255 / .07)}
.side-foot .btn-ghost{border-color:transparent;color:var(--side-ink-2)}
.side-foot .btn.busy::after{border-color:var(--side-ink) var(--side-ink) transparent}

.main{min-width:0;padding-block:0 72px;padding-inline:clamp(16px,4vw,40px)}
.main-inner{max-width:1140px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin:0 calc(-1 * clamp(16px,4vw,40px)) 22px;padding:10px clamp(16px,4vw,40px);background:rgb(245 246 250 / .9);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.tb-back{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
.tb-back:hover{background:var(--surface-2)}
.tb-back svg{width:16px;height:16px}
.ws-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 7px;border-radius:999px;background:var(--ws-soft);color:var(--ws);font-size:12.5px;font-weight:600}
.ws-badge svg{width:15px;height:15px}
.crumb{font-size:13.5px;font-weight:600;color:var(--ink)}
.crumb::before{content:"/";margin-right:10px;color:var(--line-strong);font-weight:400}
.tb-project{display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink-3)}
.tb-project svg{width:14px;height:14px;flex:none}
.tb-project select{max-width:240px;padding:6px 4px;border:0;background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;outline:none}
.seg.seg-sm button{padding:4px 10px;font-size:12.5px}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:550;font-size:13.5px;line-height:1.35;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--ws);border-color:var(--ws);color:#fff}
.btn-primary:hover{background:var(--ws);border-color:var(--ws);filter:brightness(.9)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-color:var(--ink-3) var(--ink-3) transparent;animation:spin .7s linear infinite}
.btn-primary.busy::after{border-color:#fff #fff transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--ink-3);font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font-weight:550;font-size:13.5px;text-decoration:none}
.link-btn:hover{text-decoration:underline;text-underline-offset:3px}
.link-btn svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}

.seg{display:inline-flex;flex-wrap:wrap;padding:2px;gap:2px;border-radius:8px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-weight:550;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg .n{color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums}

.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:0}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.outline{background:var(--surface);border:1px solid var(--line-strong)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12px}
.field input,.field select,.field textarea,.toolbar input,.toolbar select,.inline-select{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.35}
.field textarea{resize:vertical;min-height:84px}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus,.inline-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:9px;font-weight:550;font-size:13.5px;color:var(--ink-2)}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.check-field{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2,transparent);cursor:pointer}
.check-field input{width:16px;height:16px;margin-top:2px;flex:none;accent-color:var(--accent)}
.check-field span{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink)}
.check-field small{color:var(--ink-3);font-size:12px;line-height:1.45}
.inline-select{width:auto;padding:3px 8px;font-size:13px;border-radius:7px;max-width:170px}

/* ---------- Page scaffolding ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner p{flex:1 1 280px}
.banner.warn{background:var(--warn-soft)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.page-head>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.page-head h1{font-size:27px;line-height:1.2;letter-spacing:-.02em}
.lede{color:var(--ink-2);font-size:14.5px;max-width:70ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .grow,.grow{flex:1 1 auto}
.toolbar input[type="search"]{width:min(240px,100%)}
.toolbar select{width:auto;min-width:150px;max-width:260px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:15.5px}
.panel-head .sub{color:var(--ink-3);font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-strong);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px}
.empty strong{color:var(--ink);font-size:15px;font-weight:650}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none;background:hsl(var(--h) var(--av-s) var(--av-l));color:var(--ink);font-size:10.5px;font-weight:700}
.av.lg{width:30px;height:30px;font-size:12px}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--ink-3);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.stat .v{font-size:22px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12.5px;font-weight:500;color:var(--ink-3);margin-left:4px}

/* ---------- Today ---------- */
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:28px;line-height:1.2}
.askbar{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-1)}
.askbar svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.askbar input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;padding:6px 0}
.askbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.acts{display:flex;flex-direction:column;gap:10px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.act-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.act-ic svg{width:19px;height:19px}
.act-ic.ok{background:var(--ok-soft);color:var(--ok)}
.act-ic.warn{background:var(--warn-soft);color:var(--warn)}
.act-ic.violet{background:var(--violet-soft);color:var(--violet)}
.act-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.act-kicker{font-size:12px;font-weight:600;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act h3{font-size:15px;line-height:1.35}
.act-sub{font-size:13px;color:var(--ink-2)}
.act-cta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.side-col{display:flex;flex-direction:column;gap:14px}
.mini{display:flex;flex-direction:column}
.mini-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.mini-row:first-child{border-top:0}
.mini-row b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ws);border-radius:inherit}

/* ---------- Comments ---------- */
.fgroup{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fgroup-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.fgroup-head h2{font-size:15px;flex:1 1 200px;min-width:0}
.fgroup-head .muted{font-size:12.5px;font-weight:500}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.crow-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-3)}
.crow-text{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.crow-reply{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--line-strong)}
.crow-reply b{color:var(--ink);font-weight:600;white-space:nowrap}
.crow-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.crow-owner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.crow-actions{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.shot img{width:120px;height:80px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line)}

/* ---------- Briefs & plans ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.card h3{font-size:15px;line-height:1.35}
.card .meta{font-size:12.5px;color:var(--ink-3)}
.card .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:4px}
button.card{text-align:left;cursor:pointer;color:inherit}
button.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .t{font-weight:600;font-size:14px}
.lrow .s{font-size:13px;color:var(--ink-2)}
.lrow .m{font-size:12px;color:var(--ink-3)}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.datebox{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:12px;background:var(--ws-soft);border:1px solid var(--line)}
.datebox .k{font-size:12.5px;font-weight:600;color:var(--ws)}
.datebox .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.datebox ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.stable{width:100%;border-collapse:collapse;font-size:13.5px}
.stable th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.stable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.stable tr:last-child td{border-bottom:0}
.stable input.days{width:64px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:6px;font-variant-numeric:tabular-nums}
.stable .states{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reuse{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12.5px;color:var(--ok);font-weight:600}
.qlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.actionbar{position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-2)}
.done-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ok);text-decoration:none}
.done-link:hover{text-decoration:underline}

/* ---------- Handover & markdown ---------- */
.md{display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.md h1{font-size:22px;margin-top:4px}
.md h2{font-size:17px;margin-top:10px}
.md h3{font-size:15px;margin-top:6px}
.md ul,.md ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.md code{font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.md .cite{display:inline-block;min-width:18px;padding:0 5px;margin-left:2px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;line-height:18px;text-align:center;text-decoration:none;vertical-align:1px}
.md a.cite:hover{background:var(--accent);color:#fff}
.md span.cite{background:var(--surface-2);color:var(--ink-3)}
.srcs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:13px}
.srcs li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.srcs .n{font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.srcs a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.progress{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink-2)}
.progress .st{display:flex;gap:8px;align-items:center}
.progress .st i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
.progress .st.run i{border-color:var(--accent) var(--accent) transparent;animation:spin .7s linear infinite}
.progress .st.ok i{border-color:var(--ok);background:var(--ok)}
.progress .st.err i{border-color:var(--danger);background:var(--danger)}
.progress .st.err{color:var(--danger)}

/* ---------- Screen walkthrough ---------- */
.walk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.walk-head{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap}
.walk-head>div:first-child{display:flex;flex-direction:column;gap:2px}
.walk-head h2{font-size:16px}
.walk-head .sub{font-size:12.5px;color:var(--ink-3)}
.walk-nav{display:flex;align-items:center;gap:8px}
.walk-count{min-width:52px;text-align:center;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.walk-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
.walk-shot{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.walk-shot .frame{display:grid;place-items:center;min-height:300px;padding:16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.walk-shot .frame a{display:block;max-width:100%}
.walk-shot img{max-width:100%;max-height:560px;width:auto;height:auto;border-radius:6px;box-shadow:0 2px 10px rgb(20 24 32 / .12);background:#fff}
.walk-shot figcaption{font-size:12.5px;color:var(--ink-3)}
.noshot{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-3);font-size:13.5px}
.walk-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.walk-info h3{font-size:21px;line-height:1.25}
.walk-info h4{margin:6px 0 0;font-size:13px;font-weight:650;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.walk-info h4 .muted{font-weight:500;font-size:12.5px}
.changes{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.changes li::marker{font-weight:700;color:var(--ink-3)}
.ch-text{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.ch-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.changes details{margin-top:6px}
.changes summary{cursor:pointer;width:max-content;color:var(--accent);font-weight:600;font-size:12.5px}
.thread{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.thread b{color:var(--ink);font-weight:600}
.thread-links{display:flex;gap:12px;font-size:12.5px;font-weight:600}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.checks li{display:flex;gap:9px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border:1.5px solid var(--line-strong);border-radius:4px}
.walk-info .states{display:flex;flex-wrap:wrap;gap:6px}
.walk-thumbs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.thumb{position:relative;flex:none;width:112px;display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;color:inherit}
.thumb:hover{border-color:var(--line-strong)}
.thumb img,.thumb .ph{display:block;width:100%;height:118px;object-fit:cover;object-position:top;border-radius:6px;background:var(--surface-2)}
.thumb .tn{font-size:11.5px;font-weight:600;line-height:1.3;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb b{position:absolute;top:10px;right:10px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.flowbox{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px}
.flowbox:first-of-type{border-top:0;padding-top:0}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center}
.flow li{display:flex;align-items:center;gap:4px}
.flow li:not(:last-child)::after{content:"\2192";color:var(--ink-3);margin-left:2px}
.step{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink-2)}
.step .k{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:5px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--ink-3)}
button.step{border-color:var(--line-strong);background:var(--accent-soft);color:var(--accent);font-weight:600}
button.step .k{background:#fff;color:var(--accent)}
button.step:hover{border-color:var(--accent)}
.step b{min-width:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.gloss{margin:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.gloss dt{font-weight:650;margin-top:6px}
.gloss dt:first-child{margin-top:0}
.gloss dd{margin:0;color:var(--ink-2)}

/* ---------- Product delivery ---------- */
.nav-label{display:block;padding:14px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nav-label:first-child{padding-top:0}
.d-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;margin-top:2px}
.d-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.inline-select.d-project{max-width:min(320px,70vw)}
.seg-label{align-self:center;padding:0 4px 0 8px;font-size:12px;font-weight:600;color:var(--ink-3)}
.gantt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 14px;align-items:center}
.g-label{display:flex;flex-direction:column;font-size:13px;line-height:1.3;min-width:0}
.g-label span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.g-scale{position:relative;height:20px;border-bottom:1px solid var(--line)}
.g-scale span{position:absolute;top:0;padding-left:5px;border-left:1px solid var(--line-strong);height:20px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.g-track{position:relative;height:30px;border-radius:7px;background:var(--surface-2)}
.g-today{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;border-radius:2px;background:var(--danger);z-index:2}
.g-bar{position:absolute;top:5px;bottom:5px;min-width:10px;padding:0;border:0;border-radius:6px;background:#C7CCF8;overflow:hidden;cursor:pointer}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.g-bar.ok{background:#BFE3D4}.g-bar.ok i{background:var(--ok)}
.g-bar.warn{background:#F3DDB0}.g-bar.warn i{background:var(--warn)}
.g-bar.danger{background:#F2C3CB}.g-bar.danger i{background:var(--danger)}
.g-bar.none{background:var(--line-strong)}.g-bar.none i{background:var(--ink-3)}
.g-bar:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent-soft)}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.phase{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.phase-top{display:flex;align-items:center;gap:8px}
.phase-top h3{flex:1;font-size:15px}
.phase-top .k{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2)}
.phase-ex{font-size:13.5px;color:var(--ink-2)}
.phase-prog{display:flex;align-items:center;gap:10px}
.phase-prog .bar{flex:1}
.phase-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
.phase-dl dt{color:var(--ink-3)}
.phase-dl dd{margin:0}
.phase-foot{display:flex;gap:6px;margin-top:auto}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.danger i{background:var(--danger)}
.danger-t{color:var(--danger);font-weight:600}
.need{border-color:#F0DDB5;background:#FFFCF5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-h{margin:4px 0 0;font-size:12.5px;font-weight:650;color:var(--ink-3)}
.quickadd{display:flex;gap:6px;flex:1 1 440px;min-width:0}
.quickadd input{flex:1;min-width:0;width:auto!important}
.quickadd select{width:auto;min-width:0!important}
.load{display:flex;flex-direction:column}
.load-row{display:grid;grid-template-columns:minmax(0,190px) 110px minmax(60px,1fr) 64px auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.load-row:first-child{border-top:0}
.load-row .bar.danger{background:#F7D7DC}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px;border-radius:12px;background:var(--surface-2)}
.col header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col h3{font-size:13px}
.col .n{font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col-blocked{background:#FCEFF1}
.col-empty{padding:6px 4px;font-size:12.5px}
.tcard{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-1)}
.tcard-main{display:flex;flex-direction:column;gap:6px;padding:10px 11px;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.tcard-main:hover{background:#FAFBFC}
.tcard-tags{display:flex;flex-wrap:wrap;gap:4px}
.tcard-tags .chip{padding:0 6px;font-size:11px}
.tcard-title{font-size:13.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.tcard-block{font-size:12px;font-weight:550;color:var(--danger)}
.tcard-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--ink-3)}
.tcard-meta .av{width:20px;height:20px;font-size:9.5px}
.tcard-meta .who{font-weight:600;color:var(--ink-2)}
.tcard-next{padding:6px 11px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:12px;font-weight:600;text-align:left;cursor:pointer}
.tcard-next:hover{background:var(--accent-soft)}
.bns{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.bn{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bn.high{border-color:#F0C6CE;background:#FFF8F9}
.bn.med{border-color:#EFDDB6;background:#FFFCF5}
.bn-top{display:flex;align-items:flex-start;gap:8px}
.bn-top h3{font-size:14.5px;line-height:1.35}
.sev{flex:none;margin-top:1px;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-weight:700}
.bn.high .sev{background:var(--danger-soft);color:var(--danger)}
.bn.med .sev{background:var(--warn-soft);color:var(--warn)}
.bn ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.bn p{font-size:13.5px}
.bn-impact,.bn-action{font-size:13px!important;color:var(--ink-2)}
.bn-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.report{width:100%;max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;padding:24px clamp(16px,3vw,32px);border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-1)}
.rep-head{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rep-head h2{font-size:22px}
.rep-status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.rep-summary{margin-top:6px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;line-height:1.55}
.rep-sec{display:flex;flex-direction:column;gap:8px}
.rep-sec h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.rep-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;overflow-wrap:anywhere}
.rep-rows{display:flex;flex-direction:column;gap:9px}
.rep-row{display:grid;grid-template-columns:120px minmax(80px,1fr) 44px minmax(0,1.5fr);gap:12px;align-items:center;font-size:13.5px}
.rep-row .l{font-weight:600}
.rep-row .m{font-size:12.5px;color:var(--ink-3)}
.blockbox{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;background:var(--danger-soft)}
.checks-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.bd-list{display:flex;flex-direction:column;gap:8px}
.bd-item{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.bd-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:25px;font-size:12.5px;color:var(--ink-3)}
.people-row.team-row{grid-template-columns:minmax(0,1.2fr) 150px minmax(0,1.2fr) 56px minmax(0,1fr)}

/* ---------- Project hub ---------- */
.scope-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.scope-main,.scope-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.scope-sum{font-size:16px;line-height:1.6;max-width:68ch}
.scope-users{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.sub-h{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.feat li{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.feat li>div{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.feat p{font-size:13.5px;color:var(--ink-2)}
.howbuilt{display:flex;flex-direction:column}
.hb{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.hb:first-child{border-top:0;padding-top:0}
.hb-q{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.hb p{margin-top:4px;color:var(--ink-2);font-size:13.5px}
.hb .hb-why{font-size:12.5px;color:var(--ink-3)}
.hb-more{margin-top:4px;border-top:1px solid var(--line);padding-top:10px}
.hb-more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent)}
.hb-more .howbuilt{margin-top:10px}
.declog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.declog li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.role{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.role:first-of-type{border-top:0;padding-top:0}
.role-h{display:flex;justify-content:space-between;font-size:13.5px}
.role p{font-size:12.5px}
.role-names{display:flex;flex-direction:column;gap:5px;margin-top:4px;font-size:13px}
.role-names .who{font-weight:600}
.role-names small{font-weight:400;color:var(--ink-3)}
.tq-group{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tq{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.tq legend{padding:0;font-size:14px;font-weight:650}
.tq>small{font-size:12.5px;color:var(--ink-3)}
.tq-opts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.tq-opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.tq-opt:hover{border-color:var(--line-strong)}
.tq-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tq-opt input{margin-top:3px;accent-color:var(--accent);flex:none}
.tq-opt span{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.tq-opt em{font-style:normal;font-size:12.5px;color:var(--ink-2)}
.tq-opt.unsure{border-style:dashed}
.explain{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--violet-soft);font-size:13.5px}
.explain b{font-size:12.5px;color:var(--violet)}
.explain .terms{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.explain .terms b{color:var(--ink)}
.explain .link-btn{align-self:flex-start;display:inline-flex;gap:5px;align-items:center;color:var(--violet)}
.plain{font-size:12.5px;color:var(--ink-2);padding-left:25px}

/* ---------- Project hub: intake, documents, review ---------- */
.banner.ok{background:var(--ok-soft)}
.hub-intake{gap:12px}
.dropzone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:22px 18px;border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--surface-2);text-align:center;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:border-color .15s,background .15s}

.dropzone input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dropzone b{color:var(--ink);font-size:14.5px}
.dz-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--surface);color:var(--ws);box-shadow:var(--shadow-1)}

.dropzone.dz-inline{flex-direction:row;justify-content:flex-start;gap:14px;min-height:0;padding:16px 18px;text-align:left}
.dz-inline .dz-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dz-inline .dz-btn{pointer-events:none;flex:none}
.hub-from{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.hub-from .btn svg,.hub-samples .btn svg,.hub-tabs svg{width:15px;height:15px}
.hub-tabs{display:flex;width:100%}
.hub-tabs button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px}
.hub-samples{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.hub-watch{font-weight:500;font-size:13px}
.pick-search{display:flex;gap:8px}
.pick-search input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pick-t{display:flex;flex-direction:column;min-width:0;flex:1;font-size:13.5px}
.pick-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-t .muted{font-size:12px}
.src-ic{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.src-ic svg{width:17px;height:17px}
.src-ic.file{background:var(--accent-soft);color:var(--accent)}
.src-ic.notion{background:#EEF0F3;color:#1F2430}
.src-ic.drive{background:#E8F3EC;color:#1E7B45}
.src-ic.paste{background:var(--warn-soft);color:var(--warn)}
.src-list{display:flex;flex-direction:column}
.src-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.src-row:first-child{border-top:0;padding-top:2px}
.src-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.src-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.src-t{font-size:14px;overflow-wrap:anywhere}
.src-top .chip svg{width:12px;height:12px;margin-right:3px;vertical-align:-2px}
.src-meta{font-size:12.5px;color:var(--ink-3)}
.src-sum{font-size:13px;color:var(--ink-2)}
.src-applied{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:550}
.src-applied svg{width:14px;height:14px;flex:none}
.src-applied.warn-t{color:var(--warn)}
.src-act{display:flex;align-items:center;gap:4px;flex:none}
.src-act .icon-btn svg{width:16px;height:16px}
.src-row.reading .src-main{opacity:.75}
i.spin{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;vertical-align:-1px}
.hb-src{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 7px;border-radius:99px;background:var(--surface-2);font-size:11.5px;font-weight:550;color:var(--ink-3);vertical-align:1px}
.hb-src svg{width:11px;height:11px}
.know{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.know li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.know li:first-child{border-top:0;padding-top:0}
.know-ic{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--line-strong)}
.know li.ok .know-ic{border:0;background:var(--ok-soft);color:var(--ok)}
.know-ic svg{width:11px;height:11px}
.know-k{font-weight:550}
.rv-head{display:flex;align-items:center;gap:12px}
.rv-head>div{display:flex;flex-direction:column;min-width:0}
.rv-head .muted{font-size:12.5px}
.rv-group{flex:none;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rv-gh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.rv-gh h3{font-size:14.5px}
.rv-ic{display:grid;place-items:center;width:26px;height:26px;border-radius:7px}
.rv-ic svg{width:15px;height:15px}
.rv-overview .rv-ic{background:var(--accent-soft);color:var(--accent)}
.rv-design .rv-ic{background:var(--design-soft);color:var(--design)}
.rv-engineering .rv-ic{background:var(--eng-soft);color:var(--eng)}
.rv-overview{border-top:3px solid var(--accent)}
.rv-design{border-top:3px solid var(--design)}
.rv-engineering{border-top:3px solid var(--eng)}
.rv-sub{display:flex;align-items:center;gap:8px;margin:0;padding:12px 14px 4px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.rv-item{display:flex;flex-direction:column;gap:4px;padding:8px 14px 10px;border-top:1px solid var(--line)}
.rv-sub+.rv-item{border-top:0}
.rv-item .check{align-items:flex-start;color:var(--ink);font-weight:500;font-size:13.5px}
.rv-item .check input{margin-top:2px;flex:none}
.rv-main b{font-weight:600}
.rv-item.off .rv-main,.rv-item.off .plain{color:var(--ink-3)}
.rv-item.dupe{background:var(--surface-2)}
.rv-was{display:block;margin-top:4px;color:var(--ink-3)}
.rv-done{display:grid;place-items:center;width:16px;height:16px;flex:none;margin-top:2px;border-radius:50%;background:var(--ok-soft);color:var(--ok)}
.rv-done svg{width:10px;height:10px}
.drawer-foot .muted{align-self:center}

/* ---------- Modals, recipients, assigning ---------- */
.warn-t{color:var(--warn);font-weight:600}
.ok-t{color:var(--ok);font-weight:600}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.drawer.modal{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));max-height:min(88vh,780px);border-radius:16px;animation:pop .16s ease-out}
.drawer.modal.wide{width:min(760px,calc(100% - 32px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}}
@keyframes slideup{from{transform:translateY(24px);opacity:0}}
.rcpts{display:flex;flex-wrap:wrap;gap:6px;padding:6px;min-height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.rcpt{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 6px;border-radius:9px;background:var(--surface-2);max-width:100%}
.rcpt .av{width:24px;height:24px}
.rcpt-t{display:flex;flex-direction:column;min-width:0;line-height:1.25;font-size:13px}
.rcpt-t small{color:var(--ink-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcpt.missing{background:var(--warn-soft)}
.rcpt-mail{width:200px;max-width:100%;margin-top:2px;padding:3px 6px;border:1px solid var(--warn);border-radius:6px;background:var(--surface);font-size:12.5px}
.rcpt-x{border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:0 6px;border-radius:6px}
.rcpt-x:hover{background:var(--surface-3);color:var(--ink)}
.rcpt-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.rcpt-add select,.rcpt-add input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:13px;min-width:0}
.cm-note{font-size:12.5px}
.as-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.as-row{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.as-row:first-child{border-top:0}
.as-t{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13.5px}
.as-t .muted{font-size:12px}
.as-t q{quotes:"“" "”";color:var(--ink)}
.as-plain{font-size:12.5px}
.as-st{font-size:12.5px;font-weight:550}
.as-pick{display:flex;flex-direction:column;gap:3px}
.as-pick select,.fx-ctl select,.fx-ctl input{width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:13px}
.as-pick small{font-size:11.5px;color:var(--ink-3)}
.as-notify{font-weight:500}
.fx-row{grid-template-columns:minmax(0,1fr) 320px}
.fx-ctl{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px}
.rep-list{display:flex;flex-direction:column;gap:10px}
.rep-proj{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.rep-proj>.muted{font-size:12.5px;margin-top:-4px}
.rep-opt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px}
.rep-opt>span{flex:1;min-width:140px;font-weight:550}

/* ---------- Bugs ---------- */
.bug-id{display:inline-flex;align-items:center;padding:0 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-family:var(--mono);font-size:11.5px;font-weight:500;line-height:1.7;white-space:nowrap}
.chip.sev-critical{background:#7F1D1D;color:#fff}
.chip.sev-high{background:var(--danger-soft);color:var(--danger)}
.chip.sev-medium{background:var(--warn-soft);color:var(--warn)}
.chip.sev-low{background:var(--surface-2);color:var(--ink-2)}
.bug-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.bug-tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:inherit;font-size:13px;font-weight:600;border-top-width:3px}
.bug-tile .num{font-size:22px;line-height:1.15}
.bug-tile small{font-size:11.5px;font-weight:400;color:var(--ink-3);line-height:1.35}
.bug-tile.sev-critical{border-top-color:#7F1D1D}.bug-tile.sev-high{border-top-color:var(--danger)}.bug-tile.sev-medium{border-top-color:var(--warn)}.bug-tile.sev-low{border-top-color:var(--line-strong)}
.bug-tile.plain{border-top-color:var(--eng)}
button.bug-tile:hover{background:var(--surface-2)}
.bug-tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--eng) inset}
.bug-list{display:flex;flex-direction:column;gap:8px}
.bug-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:12px 14px 12px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:inherit;overflow:hidden;box-shadow:var(--shadow-1)}
button.bug-row{cursor:pointer}
button.bug-row:hover{border-color:var(--line-strong);background:#FBFCFD}
.bug-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-strong)}
.bug-row.sev-critical .bug-bar{background:#7F1D1D}.bug-row.sev-high .bug-bar{background:var(--danger)}.bug-row.sev-medium .bug-bar{background:var(--warn)}
.bug-row.fixed{opacity:.72}
.bug-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.bug-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.bug-top b{font-size:14.5px;overflow-wrap:anywhere}
.bug-actual{font-size:13px;color:var(--ink-2)}
.bug-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3)}
.bug-meta .warn-t{font-weight:550}
.bug-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px}
.bug-side .av{width:20px;height:20px;font-size:9.5px}
.bug-ai{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent)}
.bug-ai svg{width:13px;height:13px}
.bug-ai.ok{color:var(--ok)}
.bug-ai.none{color:var(--ink-3);font-weight:500}
.bug-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.bug-sec{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.bug-sec h3{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
small.filled{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:550}
small.filled svg{width:12px;height:12px}
.bai{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--accent-soft),var(--surface) 90px);flex:none}
.bai.empty{background:var(--surface-2)}
.bai h4{margin:8px 0 0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.bai p{font-size:13.5px}
.bai-head{display:flex;align-items:flex-start;gap:10px}
.bai-head>div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.bai-head .muted{font-size:12.5px}
.bai-ic{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:9px;background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}
.bai-ic svg{width:16px;height:16px}
.bai-sum{font-weight:550}
.bai-tech{font-size:13px}
.bai-tech summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:13px}
.bai-tech p{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-family:var(--mono);font-size:12px;line-height:1.55}
.bai-checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bai-checks li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.bai-checks li>div{display:flex;flex-direction:column;min-width:0}
.bai-checks li span:not(.bai-mark){color:var(--ink-2)}
.bai-mark{display:grid;place-items:center;width:18px;height:18px;flex:none;margin-top:1px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:11px;font-weight:800}
.bai-mark svg{width:11px;height:11px}
.bai-checks li.no .bai-mark{background:var(--warn-soft);color:var(--warn)}
.bai-gaps{margin:0;padding-left:18px;font-size:13px;color:var(--warn)}
.bai-verify{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.bai-rel{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.fixes{display:flex;flex-direction:column;gap:8px}
.fix{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fix.chosen{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fix-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px}
.fix p{margin-top:4px;font-size:13px;color:var(--ink-2)}
.fix-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.tcard.is-bug{border-left:3px solid var(--warn)}
.tcard.is-bug.sev-critical{border-left-color:#7F1D1D}.tcard.is-bug.sev-high{border-left-color:var(--danger)}.tcard.is-bug.sev-low{border-left-color:var(--line-strong)}
.hint-line{display:flex;align-items:center;gap:6px;font-size:13px}
.hint-line svg{width:15px;height:15px}

/* ---------- Tasks and issues, explained ---------- */
.tl{display:flex;flex-direction:column;gap:18px}
.tl-sec>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.tl-sec>header h2{font-size:16px}
.tl-sec>header .muted{font-size:12.5px}
.tl-sec.attn>header h2{color:var(--danger)}
.tl-items{display:flex;flex-direction:column;gap:8px}
.ti{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.tl-sec.attn .ti{border-left:3px solid var(--danger)}
.ti.is-done{opacity:.75}
.ti-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;width:100%;padding:12px 14px;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.ti-main:hover{background:#FBFCFD}
.ti-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);flex:none}
.ti-ic svg{width:16px;height:16px}
.ti-ic.danger{background:var(--danger-soft);color:var(--danger)}.ti-ic.warn{background:var(--warn-soft);color:var(--warn)}.ti-ic.violet{background:var(--design-soft);color:var(--design)}.ti-ic.teal{background:var(--eng-soft);color:var(--eng)}
.ti-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.ti-kind{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-3)}
.ti-title{font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.ti-plain{font-size:13.5px;color:var(--ink-2)}
.ti-plain.auto{color:var(--ink-3)}
.ti-why{font-size:12.5px;color:var(--ink-2)}
.ti-status{font-size:12.5px;color:var(--ink-2)}
.ti-status.danger-t{color:var(--danger)}.ti-status.warn-t{color:var(--warn)}.ti-status.ok-t{color:var(--ok)}
.ti-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12.5px}
.ti-side .av{width:20px;height:20px;font-size:9.5px}
.ti-src{display:inline-flex;align-items:center;gap:4px;max-width:180px}
.ti-src svg{width:12px;height:12px;flex:none}
.ti-next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px 14px 8px 58px;border-top:1px dashed var(--line);background:var(--surface-2);font-size:13px}
.ti-next .btn svg{width:14px;height:14px}
.tl-done summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);margin-bottom:8px}
.glance{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13.5px;flex:none}
.gl-kind{display:flex;align-items:center;gap:8px;font-size:13px}
.gl-kind .ti-ic{width:26px;height:26px}
.gl-kind .ti-ic svg{width:14px;height:14px}
.gl-plain{font-size:14px}
.gl-plain.auto{color:var(--ink-2)}
.gl-next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-top:6px;border-top:1px solid var(--line)}

/* ---------- Budget ---------- */
.bmodels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bmodel{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:inherit;font-size:13px}
.bmodel b{font-size:15px}
.bmodel span{color:var(--ink-2)}
.bmodel:hover{border-color:var(--accent);background:var(--accent-soft)}
.bverdict{gap:12px}
.bverdict.danger{border-left:4px solid var(--danger)}.bverdict.warn{border-left:4px solid var(--warn)}.bverdict.ok{border-left:4px solid var(--ok)}
.bv-top{display:flex;gap:12px;align-items:flex-start}
.bv-top .chip{flex:none;margin-top:2px}
.bv-top p{font-size:14.5px;line-height:1.55}
.bv-note{font-size:12.5px}
.bbar{display:flex;flex-direction:column;gap:8px}
.bbar-track{position:relative;height:14px;border-radius:999px;background:var(--surface-2);overflow:visible}
.bbar-track span{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bbar-need{background:#C7CCF8}
.bbar-need.over{background:repeating-linear-gradient(135deg,#F6C9C9 0 6px,#FBE3E3 6px 10px)}
.bbar-used{background:var(--accent);border-right:2px solid var(--surface)}
.bbar-lim{width:2px;top:-5px!important;bottom:-5px!important;border-radius:1px!important;background:var(--ink);transform:translateX(-1px)}
.bbar-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2)}
.bbar-legend span{display:inline-flex;align-items:center;gap:6px}
.bbar-legend .k{display:inline-block;width:12px;height:8px;border-radius:3px}
.k.used{background:var(--accent)}.k.need{background:#C7CCF8}.k.need.over{background:repeating-linear-gradient(135deg,#F6C9C9 0 3px,#FBE3E3 3px 5px)}.k.lim{width:2px!important;height:12px!important;border-radius:1px!important;background:var(--ink)}.k.plan{width:2px!important;height:12px!important;background:var(--ink-3)}
.tile.btile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.btile>span{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.btile .tile-v{font-size:20px}
.tile-s{font-size:12px;color:var(--ink-3)}
.btable{width:100%;border-collapse:collapse;font-size:13px}
.btable th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.btable td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.btable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btable th.num{text-align:right}
.btable td small{font-size:11.5px}
.btable .sub-row td{color:var(--ink-2)}
.btable .tot-row td{font-weight:700;border-bottom:0}
.btable.compact td{padding:6px 6px 6px 0}
.rate-edit input{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);font-size:13px;text-align:right}
.rate-edit td:first-child{width:34%}
.rbar{position:relative;display:flex;gap:2px;min-width:120px;height:8px;border-radius:999px;background:var(--surface-2)}
.rbar i{display:block;height:100%;border-radius:999px}
.rbar i.s{background:var(--accent)}.rbar i.l{background:#C7CCF8}
.rbar i.p{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink-3)}
.blist{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;font-size:13.5px}
.brow:first-child{border-top:0}
button.brow:hover{background:var(--surface-2)}
.brow-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.brow-main .muted{font-size:12.5px}
.brow-meta{font-size:12px!important}
.brow-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.clist{display:flex;flex-direction:column}
.crow2{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;font-size:13px}
.crow2:first-child{border-top:0}
.crow2:hover{background:var(--surface-2)}
.crow2>span{display:flex;flex-direction:column;min-width:0}
.crow2 small{font-size:11.5px}
.crow2-side{align-items:flex-end;flex:none}
.bdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
.bdl dt{color:var(--ink-3)}
.bdl dd{margin:0;font-weight:550}
.cr-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cr-days label{display:flex;flex-direction:column;gap:3px}
.cr-days small{font-size:11.5px;color:var(--ink-3)}
.cr-days input{padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:13px}
.cr-est{font-size:12.5px}

/* Budget v2: per-project colours, overview, hero, envelopes */
.pc-0{--pc:#4F46E5;--pc-soft:#EEF0FF}.pc-1{--pc:#0F8A7E;--pc-soft:#E3F4F1}.pc-2{--pc:#7C3AED;--pc-soft:#F3EEFF}.pc-3{--pc:#BE185D;--pc-soft:#FCE7F3}.pc-4{--pc:#0369A1;--pc-soft:#E0F2FE}
.bstrip{display:flex;flex-direction:column;gap:10px}
.bstrip-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.bstrip-head h2{margin:0;font-size:15px}
.bstrip-head .sub{font-size:12.5px;color:var(--ink-3)}
.bstrip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bproj{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:12px;background:var(--surface);text-align:left;color:inherit;font-size:13px;min-width:0;cursor:pointer}
.bproj:hover{background:var(--pc-soft)}
.bproj[aria-current="true"]{background:var(--pc-soft);border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.bproj-top{display:flex;align-items:center;gap:8px;min-width:0}
.bproj-top b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--pc)}
.bproj-type{font-size:12px;color:var(--ink-3)}
.bproj-nums{font-size:12.5px;color:var(--ink-2)}
.bproj-nums b{font-size:15px;color:var(--ink)}
.bproj-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bproj-foot small{font-size:12px;color:var(--ink-3)}
.mbar{display:block;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px;background:var(--pc,var(--accent))}
.bhero{border-top:4px solid var(--pc);gap:14px}
.bhero-top{display:flex;align-items:flex-start;gap:12px}
.bhero-ic{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--pc-soft);color:var(--pc)}
.bhero-ic svg{width:20px;height:20px}
.bhero-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.bhero-t h2{margin:0;font-size:19px;line-height:1.25}
.bhero-sub{font-size:12.5px;color:var(--ink-3)}
.bhero-top>.chip{flex:none;margin-top:4px}
.bnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bnum{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface-2);min-width:0}
.bnum-k{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.bnum b{font-size:26px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bnum small{font-size:12px;color:var(--ink-2)}
.bnum.rem{background:var(--pc-soft,var(--accent-soft))}
.bnum.rem b{color:var(--pc,var(--accent))}
.bnum.neg{background:var(--danger-soft)}.bnum.neg b{color:var(--danger)}
.bnums.sm{margin-bottom:12px}.bnums.sm .bnum{padding:10px 12px}.bnums.sm .bnum b{font-size:18px}
.bmeter{display:flex;flex-direction:column;gap:8px}
.bmeter-track{position:relative;height:16px;border-radius:999px;background:var(--surface-3)}
.bmeter-track span{position:absolute;top:0;bottom:0;left:0}
.bm-budget{background:var(--surface-2);border-radius:999px;box-shadow:0 0 0 1px var(--line) inset}
.bm-used{background:var(--pc,var(--accent));border-radius:999px 0 0 999px}
.bm-booked{background:repeating-linear-gradient(135deg,var(--pc,var(--accent)) 0 3px,transparent 3px 7px);opacity:.55}
.bm-over{background:repeating-linear-gradient(135deg,#F6C9C9 0 6px,#FBE3E3 6px 10px);border-radius:0 999px 999px 0}
.bm-exp{width:3px;top:-5px!important;bottom:-5px!important;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
.bm-exp.over{background:var(--danger)}
.bm-lim{width:2px;top:-3px!important;bottom:-3px!important;background:var(--ink-2);transform:translateX(-1px)}
.bm-work{top:-9px!important;bottom:auto!important;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ok);transform:translateX(-6px)}
.bmeter .k.used{background:var(--pc,var(--accent))}
.k.booked{background:repeating-linear-gradient(135deg,var(--pc,var(--accent)) 0 2px,transparent 2px 4px);opacity:.7}
.k.exp{width:3px!important;height:12px!important;border-radius:1px!important;background:var(--ink)}.k.exp.over{background:var(--danger)}
.k.work{width:0!important;height:0!important;border-radius:0!important;border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid var(--ok)}
.bhero-say{margin:0;font-size:14.5px;line-height:1.55}
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.env{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:inherit;font-size:13px;min-width:0}
button.env{cursor:pointer}
button.env:hover{border-color:var(--line-strong);box-shadow:var(--shadow-2)}
.env-top{display:flex;align-items:flex-start;gap:10px;min-width:0}
.env-ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.env-ic svg{width:16px;height:16px}
.env-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.env-t b{font-size:13.5px;line-height:1.3}
.env-t small{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.env-big{font-size:20px;font-weight:700;line-height:1.2}
.env-bar{display:flex;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.env-bar i{display:block;height:100%}
.env-bar i.u{background:var(--pc,var(--accent))}
.env-bar i.bk{background:repeating-linear-gradient(135deg,var(--pc,var(--accent)) 0 3px,transparent 3px 6px);opacity:.55}
.env-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.env-foot .muted{font-size:12px}
.env.cat-team{border-color:var(--pc);background:linear-gradient(var(--pc-soft),var(--surface) 70%)}
.env.cat-team .env-ic{background:var(--pc);color:#fff}
.env.cat-buffer .env-ic{background:var(--ok-soft);color:var(--ok)}
.env.cat-buffer .env-bar i.u{background:var(--warn)}
.env.over{border-color:#F1B4B4}
.env.over .env-big{color:var(--danger)}
.env.over .env-bar i.u{background:var(--danger)}
.env.noplan{border-style:dashed}
.env.willover{border-color:#F3D19C}
.env-note{border-style:dashed;background:var(--surface-2)}
.env-unpriced{cursor:pointer;text-align:left;color:inherit}.env-unpriced .env-big{font-size:15px;color:var(--accent)}
.env-note.danger{background:var(--danger-soft);border-color:#F1B4B4}
.env-note.danger .env-big{color:var(--danger)}
.env-add{align-items:flex-start;justify-content:center;border-style:dashed;background:transparent;color:var(--ink-2)}
.env-add b{color:var(--ink)}
.env-add small{font-size:12px;color:var(--ink-3)}
.env-add-plus{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface-2)}
.env-add-plus svg{width:16px;height:16px}
.bin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bin>div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface-2);min-width:0}
.bin b{font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bprofit{display:flex;gap:8px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:10px;font-size:13.5px}
.bprofit svg{flex:none;width:16px;height:16px;margin-top:2px}
.bprofit.ok{background:var(--ok-soft)}.bprofit.ok svg{color:var(--ok)}
.bprofit.warn{background:var(--warn-soft)}.bprofit.warn svg{color:var(--warn)}
.bprofit.danger{background:var(--danger-soft)}.bprofit.danger svg{color:var(--danger)}
.ptype-seg button{white-space:normal}
.line-edit td{vertical-align:middle}
.line-edit .lr-on{width:28px}
.line-edit .lr-on input{width:16px;height:16px;accent-color:var(--accent)}
.lr-main{display:flex;align-items:center;gap:10px}
.lr-ic{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.lr-ic svg{width:14px;height:14px}
.lr-f{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.lr-label,.lr-cat,.lr-amt{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);font-size:13px}
.lr-f small{font-size:11.5px}
.lr-amt-c{width:130px}
.lr-amt{text-align:right}
.line-edit tr:has(.lr-on input:not(:checked)) .lr-main,.line-edit tr:has(.lr-on input:not(:checked)) .lr-amt{opacity:.45}
.bs-type-note{margin:0 0 4px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font-size:12.5px;color:var(--ink-2)}
.line-edit tr.lr-off .lr-why{color:var(--warn)}
.line-edit tr.lr-new td{background:var(--accent-soft)}
.line-edit tr.lr-new .lr-why::before{content:'New · ';font-weight:700;color:var(--accent)}
.sugg{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sugg-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px dashed var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:550;cursor:pointer}
.sugg-chip svg{width:12px;height:12px}
.sugg-chip:hover,.sugg-chip[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
@media (max-width:640px){
  .bnums{gap:6px}.bnum{padding:10px}.bnum b{font-size:19px}.bnum small{font-size:11px}
  .bin b{font-size:15px}
  .bstrip-grid{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(220px,78%);overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
  .bproj{scroll-snap-align:start}
  .envs{grid-template-columns:minmax(0,1fr)}
  .lr-amt-c{width:96px}
}

/* ---------- Workspace homes ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tile-ic{grid-row:1 / span 2;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--ws-soft);color:var(--ws)}
.tile-ic svg{width:19px;height:19px}
.tile-v{font-size:22px;font-weight:600;line-height:1.1}
.tile-k{font-size:12.5px;color:var(--ink-3);line-height:1.3}
.tile.danger .tile-ic{background:var(--danger-soft);color:var(--danger)}
.tile.warn .tile-ic{background:var(--warn-soft);color:var(--warn)}
.tile.ok .tile-ic{background:var(--ok-soft);color:var(--ok)}
.tile.info .tile-ic{background:var(--accent-soft);color:var(--accent)}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.home-main,.home-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.bn-list{display:flex;flex-direction:column}
.bn-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.bn-row:first-child{border-top:0;padding-top:0}
.bn-row .sev{justify-self:start;align-self:start;margin-top:1px;text-align:center}
.bn-row.high .sev{background:var(--danger-soft);color:var(--danger)}
.bn-row.med .sev{background:var(--warn-soft);color:var(--warn)}
.bn-row p{color:var(--ink-2);font-size:13px;margin-top:2px}
.due-list{display:flex;flex-direction:column}
.due-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 6px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;border-radius:0;font-size:13.5px}
.due-row:first-child{border-top:0}
.due-row:hover{background:var(--surface-2)}
.due-date{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.due-t{min-width:0;font-weight:500;overflow-wrap:anywhere}
.due-o{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.due-o .av{width:20px;height:20px;font-size:9.5px}
.ph-list{display:flex;flex-direction:column;gap:12px}
.ph-row{display:flex;flex-direction:column;gap:5px}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.ph-d{font-size:12px}
.ph-row .phase-prog{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center}
.ph-row .phase-prog b{text-align:right}
.howbuilt.flat .hb{grid-template-columns:minmax(0,1fr)}
.howbuilt.flat .hb:first-child{border-top:0;padding-top:0}
.howbuilt.flat .hb-q{display:none}
.wl{display:flex;flex-direction:column;gap:8px}
.wl-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 56px;gap:10px;align-items:center;font-size:13px}
.wl-row .av{width:22px;height:22px;font-size:9.5px}
.wl-row .who span:last-child{font-weight:500}
.fl{display:flex;flex-direction:column}
.fl-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.fl-row:first-child{border-top:0}
.fl-row svg{width:16px;height:16px;color:var(--design);flex:none}
.fl-n{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column}
.stack-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.stack-row:first-child{border-top:0}
.tech-progress{display:flex;align-items:center;gap:12px}
.tech-progress .bar{flex:1;max-width:360px}
.gloss-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 24px}
.gloss-2>div{display:flex;flex-direction:column;gap:2px}
.gloss-2 dt{margin-top:0!important}

/* ---------- Ask ---------- */
.chat{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:8px;max-width:760px}
.msg.q{align-self:flex-end;background:var(--accent);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;font-weight:500}
.msg.a{background:var(--surface);border:1px solid var(--line);padding:14px 16px;border-radius:14px 14px 14px 4px}
.msg .used{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.msg .used a{font-size:12px;font-weight:600;text-decoration:none;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .used a:hover{background:var(--accent-soft);color:var(--accent)}
.thinking{color:var(--ink-3);font-size:13.5px;display:flex;align-items:center;gap:8px}
.thinking::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-color:var(--accent) var(--accent) transparent;animation:spin .7s linear infinite}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.suggest button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:550;color:var(--ink-2)}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}
.composer{position:sticky;bottom:12px;display:flex;gap:8px;align-items:flex-end;padding:8px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-2)}
.composer textarea{flex:1;border:0;outline:none;resize:none;min-height:40px;max-height:160px;padding:8px 8px;font-size:15px;background:transparent}

/* ---------- Drawer & toasts ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease-out}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);box-shadow:var(--shadow-2);display:flex;flex-direction:column;animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:17px}
.drawer-body{flex:1;overflow:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;margin:0}
